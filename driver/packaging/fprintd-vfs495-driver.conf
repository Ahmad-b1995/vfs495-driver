# vfs495-driver: log the matcher's scores (>= 40 is a match), fprintd's result and the
# driver's view of every swipe, for vfs495-scores (driver/tools/scores.sh); and a folder for
# the driver's opt-in beta diagnostics (vfs495-diag), which fprintd's sandbox
# (ProtectSystem=strict) would otherwise keep read-only. The folder is created root-only.
[Service]
Environment="G_MESSAGES_DEBUG=libfprint-print fprintd libfprint-vfs495"
StateDirectory=vfs495-driver
